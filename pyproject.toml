[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypoligram"
dynamic = ["version"]
description = "Simplifies the process of handling multiple clients"
readme = "README.md"
license = { file = "COPYING" }
authors = [
  { name = "MemoKing34", email = "karam24@itu.edu.tr" }
]
requires-python = ">=3.8"
dependencies = [
  "typing-extensions; python_version < \"3.11\""
]

[project.optional-dependencies]
dev = [
  "kurigram>=2.2.1",
  "hatch>=1.15.1",
]

[tool.hatch.version]
path = "pypoligram/__init__.py"

[tool.tox]
env_list = ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.tox.env_run_base]
description = "run the test suite"
deps = ["kurigram"]
commands = [
    ["python", "-c", "import pypoligram; print(pypoligram.__version__)"],
]

[project.urls]
Homepage = "https://github.com/MemoKing34/pypoligram"
Repository = "https://github.com/MemoKing34/pypoligram"
Documentation = "https://github.com/MemoKing34/pypoligram/blob/master/DOCUMENTATION.md"
